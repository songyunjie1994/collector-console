<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>采集管理台</title>
<link rel="stylesheet" href="./console.css">
</head>
<body>
<!-- 登录 -->
<section id="loginView" class="view">
  <div class="login-card">
    <h1>采集管理台</h1>
    <p class="muted">只对管理员开放。登录后能看到采集机在不在线、定时任务改没改生效、最近采集结果。</p>
    <label>邮箱<input id="email" type="email" autocomplete="username" placeholder="you@example.com"></label>
    <label>密码<input id="password" type="password" autocomplete="current-password"></label>
    <button id="loginBtn" class="primary">登录</button>
    <p id="loginError" class="error"></p>
  </div>
</section>

<!-- 主界面 -->
<section id="mainView" class="view hidden">
  <header>
    <h1>采集管理台</h1>
    <div class="right">
      <span id="whoami" class="muted"></span>
      <button id="logoutBtn" class="ghost">退出</button>
    </div>
  </header>

  <div id="banner" class="banner">
    采集机必须<b>开机并处于登录状态</b>才会采集。锁屏、注销、重启后没登录，定时任务不会执行。
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-head">
        <h2>采集机</h2>
        <button id="refreshAgents" class="ghost">刷新</button>
      </div>
      <div id="agentList" class="list"></div>
    </div>

    <div class="card grow">
      <div class="card-head">
        <h2>定时任务</h2>
        <div class="right">
          <span id="agentTitle" class="muted">先在左边选一台采集机</span>
          <button id="addSchedule" class="primary" disabled>新增</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="scheduleTable">
          <thead>
            <tr>
              <th>开启</th><th>工具</th><th>每天几点</th><th>时区</th>
              <th>允许执行窗口</th><th>错过怎么办</th><th>生效状态</th><th></th>
            </tr>
          </thead>
          <tbody id="scheduleBody">
            <tr><td colspan="8" class="muted pad">还没有数据</td></tr>
          </tbody>
        </table>
      </div>
      <p class="muted small">
        「云端已保存」只表示写进云端了；<b>必须等设备下一次心跳拉取后才算真正生效</b>（一般 20 秒内）。
        设备拉不到时（断网）会继续用本地已生效的那份配置照常跑。
      </p>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>最近的采集执行记录</h2>
      <button id="refreshRuns" class="ghost">刷新</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>计划时间</th><th>工具</th><th>状态</th><th>怎么触发的</th><th>用了哪版配置</th><th>摘要</th><th>日志</th></tr>
        </thead>
        <tbody id="runBody">
          <tr><td colspan="7" class="muted pad">还没有数据</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<div id="toast" class="toast hidden"></div>
<script src="./console.js"></script>
</body>
</html>
